services:
  - type: web
    name: researchmate-ai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && PYTHONPATH=. python create_sample_files.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
